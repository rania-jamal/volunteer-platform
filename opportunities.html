<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة الفرص التطوعية - استعراض الفرص</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .opportunity-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>الفرص التطوعية المتاحة</h1>

        <!-- محاكاة لقائمة الفرص التطوعية -->
        <div class="opportunity-card">
            <h2>تطوع في تنظيم معرض الكتاب الجامعي</h2>
            <p>التصنيف: تنظيم وتنسيق | التاريخ: 2026-11-15</p>
            <p>مساعدة في تنظيم قاعات المعرض واستقبال الزوار والضيوف.</p>
        </div>

        <div class="opportunity-card">
            <h2>حملة التشجير البيئي في حرم الجامعة</h2>
            <p>التصنيف: بيئة ومجتمع | التاريخ: 2026-11-20</p>
            <p>المشاركة في زراعة الأشتال وتنظيف الحدائق الجامعية.</p>
        </div>
    </div>
</body>
</html>
